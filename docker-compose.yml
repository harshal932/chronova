version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: chronova_db
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: chronova_api
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/chronova
      - JWT_SECRET=chronova_super_secret_jwt_key_2026_luxury_watches
      - JWT_EXPIRE=7d
      - FRONTEND_URL=http://localhost:3000
      - NODE_ENV=production
    depends_on:
      - mongodb
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: chronova_web
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
      - PORT=3000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo_data:
